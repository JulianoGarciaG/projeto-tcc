{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  /*
    Layout base dos documentos PDF (xhtml2pdf) — réplica 1:1 de docs/pdf-models/.
    Contém apenas o CSS COMUM aos 3 mockups; o CSS exclusivo de cada documento
    fica no template filho (block estilos_extra).

    Paleta da marca (docs/07_design_ui_ux.md): #F2B441, #3A3A3A, #F7F3EA,
    #888888, #E0E0E0, #2E7D32, #C62828.
    Token novo específico de PDF (não documentado na paleta): #9A6B00 —
    dourado escuro usado nos filhos (badge "Regular" do laudo e rótulo da
    quantia do recibo).
  */
  @page { size: A4; margin: 2cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; line-height: 1.5; color: #3A3A3A; margin: 0; }
  .doc-header { width: 100%; border-collapse: collapse; }
  .doc-header td { vertical-align: middle; }
  .doc-logo { height: 42px; }
  .doc-meta { text-align: right; font-size: 9px; color: #888888; line-height: 1.6; }
  .doc-meta strong { color: #3A3A3A; }
  .brand-rule { height: 3px; background-color: #F2B441; margin-top: 12px; font-size: 1px; }
  .doc-title-wrap { text-align: center; margin: 30px 0 4px 0; }
  .doc-title { font-size: 18px; font-weight: bold; letter-spacing: 1.5px; text-transform: uppercase; color: #3A3A3A; }
  .doc-title-underline { width: 54px; height: 2px; background-color: #F2B441; margin: 10px auto 0 auto; font-size: 1px; }
  .sec { background-color: #F7F3EA; border-left: 4px solid #F2B441; padding: 7px 12px; margin: 22px 0 8px 0; font-size: 10px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #3A3A3A; }
  .fields { width: 100%; border-collapse: collapse; }
  .fields td { padding: 5px 0; vertical-align: top; }
  .fields td.pad { padding-right: 14px; }
  .flabel { font-size: 8px; letter-spacing: 0.5px; color: #888888; text-transform: uppercase; }
  .fval { font-size: 11px; color: #3A3A3A; }
  .cards { width: 100%; border-collapse: collapse; text-align: center; }
  .cards td { padding: 2px; }
  .card { border: 1px solid #E0E0E0; padding: 10px 6px; }
  .card-label { font-size: 8px; letter-spacing: 0.5px; color: #888888; text-transform: uppercase; }
  .card-value { font-size: 14px; font-weight: bold; color: #3A3A3A; margin-top: 4px; }
  .note-box { background-color: #FCF8EF; border-left: 3px solid #F2B441; padding: 10px 14px; font-size: 10.5px; color: #3A3A3A; }
  .sign-table { width: 100%; border-collapse: collapse; }
  .sign-cell { text-align: center; vertical-align: bottom; }
  .sign-line { border-top: 1px solid #888888; padding-top: 6px; font-size: 10px; color: #3A3A3A; }
  .sign-role { font-size: 8px; color: #888888; margin-top: 1px; }
  .doc-footer { margin-top: 38px; border-top: 1px solid #E0E0E0; padding-top: 8px; text-align: center; font-size: 8px; color: #888888; }
  .avoid-break { page-break-inside: avoid; }
  {% block estilos_extra %}{% endblock %}
</style>
</head>
<body>

  <table class="doc-header">
    <tr>
      <td><img class="doc-logo" src="{% static 'assets/Shelter_LOGO.jpg' %}" alt="Shelter"></td>
      <td class="doc-meta">{% block doc_meta %}{% endblock %}</td>
    </tr>
  </table>
  <div class="brand-rule"></div>

  <div class="doc-title-wrap">
    <div class="doc-title">{% block titulo_doc %}{% endblock %}</div>
    {% block titulo_underline %}<div class="doc-title-underline"></div>{% endblock %}
  </div>

  {% block conteudo %}{% endblock %}

  <div class="doc-footer">Documento gerado automaticamente pelo sistema Shelter — Gestão Imobiliária.</div>
</body>
</html>
