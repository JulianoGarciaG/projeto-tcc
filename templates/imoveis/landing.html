{% extends 'base.html' %}
{% block title %}Início — Shelter{% endblock %}
{% block page_title %}Início{% endblock %}

{% block content %}

<div class="card mb-4">
  <div class="card-body">
    <h4 class="mb-1">{{ saudacao }}, {{ user.get_short_name|default:user.username }}!</h4>
    <p class="text-muted mb-0">{% now "l, d \d\e F \d\e Y" %}</p>
  </div>
</div>

<div class="row g-3">
  <div class="col-6 col-md-4">
    <a href="{% url 'contrato_create' %}" class="card text-decoration-none text-body h-100">
      <div class="card-body text-center">
        <i class="bi bi-file-earmark-text fs-1" style="color: var(--brand);"></i>
        <div class="mt-2">Novo Contrato</div>
      </div>
    </a>
  </div>
  <div class="col-6 col-md-4">
    <a href="{% url 'imovel_create' %}" class="card text-decoration-none text-body h-100">
      <div class="card-body text-center">
        <i class="bi bi-house-door fs-1" style="color: var(--brand);"></i>
        <div class="mt-2">Novo Imóvel</div>
      </div>
    </a>
  </div>
  <div class="col-6 col-md-4">
    <a href="{% url 'recibo_create' %}" class="card text-decoration-none text-body h-100">
      <div class="card-body text-center">
        <i class="bi bi-receipt fs-1" style="color: var(--brand);"></i>
        <div class="mt-2">Novo Recibo</div>
      </div>
    </a>
  </div>
</div>

{% endblock %}
